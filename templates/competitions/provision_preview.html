<h1>团队账户预览</h1>{% for row in preview.rows %}<p>{{ row.team_number }}：{{ row.username }}</p>{% endfor %}{% if preview.errors %}<p>校验失败：{{ preview.errors|join:", " }}</p>{% else %}<form method="post" action="/competitions/{{ event.id }}/accounts/confirm/">{% csrf_token %}<input type="hidden" name="token" value="{{ preview.token }}"><button type="submit">确认创建</button></form>{% endif %}

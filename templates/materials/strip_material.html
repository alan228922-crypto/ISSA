{% extends 'shared/base.html' %}{% block title %}条材材料 · ISSA{% endblock %}{% block main_class %}ui-page--narrow{% endblock %}
{% block content %}<div class="ui-page-head"><div><p class="ui-eyebrow">STRIP / 材料指派</p><h1>为条材 {{ strip.name }} 指定材料</h1><p class="ui-lead">材料指派与条材几何分别管理。</p></div></div><form class="ui-card" method="post" data-ui-form>{% csrf_token %}{% if error %}<div class="ui-alert ui-alert--error" role="alert" id="strip-material-error">{{ error }}</div>{% endif %}<div class="ui-field"><label for="strip-material">材料</label><select id="strip-material" name="material_id" {% if error %}aria-invalid="true" aria-describedby="strip-material-error"{% endif %}><option value="">未指定</option>{% for material in materials %}<option value="{{ material.id }}" {% if strip.material_id == material.id %}selected{% endif %}>{{ material.name }}</option>{% endfor %}</select></div><div class="ui-form-footer"><button class="ui-primary" type="submit">保存</button><a href="{% url 'materials:index' project.id %}">取消</a></div></form>{% endblock %}

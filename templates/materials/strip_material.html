<!doctype html>
<html lang="zh-Hans"><meta charset="utf-8"><title>条材材料</title>
<body>{% include "shared/product_header.html" %}<main>
  <h1>为条材 {{ strip.name }} 指定材料</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>材料 <select name="material_id">
      <option value="">未指定</option>
      {% for material in materials %}<option value="{{ material.id }}" {% if strip.material_id == material.id %}selected{% endif %}>{{ material.name }}</option>{% endfor %}
    </select></label>
    <button type="submit">保存</button>
  </form>
  <a href="{% url 'materials:index' project.id %}">取消</a>
</main></body></html>

{% load static %}
<!doctype html>
<html lang="zh-Hans"><meta charset="utf-8"><title>{% if editing %}编辑{% else %}新建{% endif %}矩形截面</title>
<body>{% include "shared/product_header.html" %}<main data-section-designer="rectangle" data-preview-url="{% url 'projects:section_preview' project.id %}"><h1>{% if editing %}编辑{% else %}新建{% endif %}矩形截面</h1>
<p>输入尺寸与密度后，可预览截面和计算属性；保存前不会修改项目。</p>
{% if form.errors %}<p role="alert">请检查以下输入。</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">保存截面</button></form>
<section aria-label="截面预览"><h2>截面预览</h2><svg data-section-preview-svg viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="截面几何预览"></svg><p data-section-preview-status role="status">输入有效尺寸后显示预览。</p><dl data-section-properties></dl></section>
<a href="{% url 'materials:index' project.id %}">取消</a></main><script type="module" src="{% static 'materials/section-designer.js' %}"></script></body></html>

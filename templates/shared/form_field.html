{% if field.is_hidden %}{{ field }}{% elif field.field.widget.input_type == 'checkbox' %}<div class="ui-check">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label></div>{{ field.errors }}{% else %}<div class="ui-field"><label for="{{ field.id_for_label }}">{% if label %}{{ label }}{% else %}{{ field.label }}{% endif %}{% if field.field.required %}<span class="ui-sr-only">（必填）</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="ui-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{{ field.errors }}</div>{% endif %}

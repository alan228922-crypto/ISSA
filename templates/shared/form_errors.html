{% if form.errors %}<div class="ui-alert ui-alert--error" role="alert" tabindex="-1"><p>请检查以下输入。</p>{{ form.non_field_errors }}<ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}：{{ field.errors|join:'；' }}</a></li>{% endif %}{% endfor %}</ul></div>{% endif %}

{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目工作区</title>
  <link rel="stylesheet" href="{% static 'projects/workspace/workspace.css' %}">
  <style>#workspace-canvas [data-selected="true"] > *, #workspace-canvas [data-focused="true"] > *, #workspace-canvas [data-object-kind]:focus > * { stroke-dasharray: 5 3; stroke-width: 5; }</style>
</head>
<body>
  <main id="workspace-root" data-read-only="{{ bootstrap.read_only|yesno:'true,false' }}">
    <header id="workspace-project-header">
      <h1>{{ bootstrap.project.name }}</h1>
      <p id="workspace-draft-version">当前草稿 v{{ bootstrap.draft.version }}</p>
      <p id="workspace-read-only"{% if not bootstrap.read_only %} hidden{% endif %}>只读查看</p>
    </header>
    <section class="workspace-layout" aria-label="结构学习工作区">
      <aside id="workspace-modeling-panel" aria-label="建模工具">
        <h2>建模工具</h2>
        <p>选择、节点、构件、连接、支座、荷载</p>
        <button id="workspace-save" type="button"{% if bootstrap.read_only %} disabled{% endif %}>保存</button>
        <button id="workspace-model-check" type="button"{% if bootstrap.read_only %} disabled{% endif %}>模型检查</button>
        <section id="workspace-properties-panel" aria-label="对象属性">
          <h2>对象属性</h2>
          <p>选择对象后可在这里查看属性。</p>
        </section>
      </aside>
      <section class="workspace-center" aria-label="结构画布">
        <svg id="workspace-canvas" role="img" aria-label="结构画布" viewBox="0 0 1000 600"></svg>
      </section>
      <aside id="workspace-workflow-panel" aria-label="学习流程">
        <h2>学习流程</h2>
        <ol id="workspace-workflow-steps">
          <li>① 建模</li><li>② 预测</li><li>③ 分析</li><li>④ 理解</li><li>⑤ 反思</li>
        </ol>
        <section id="workspace-results" aria-label="分析结果"></section>
        <section id="workspace-reflection" aria-label="反思"></section>
      </aside>
    </section>
    <section id="workspace-dynamic-input" data-active-field="distance" hidden aria-label="动态输入">
      <label>距离 <input id="workspace-dynamic-distance" type="text" disabled></label>
      <label>角度 <input id="workspace-dynamic-angle" type="text" disabled></label>
    </section>
    <footer id="workspace-status-bar" aria-live="polite">
      <span>X: —</span><span>Y: —</span><span>ΔL: —</span><span>Angle: —</span>
      <span id="workspace-snap-indicator">ORTHO: 关 · SNAP: 关</span>
      <span id="workspace-save-status">未保存修改：无</span>
    </footer>
    <section id="workspace-error" hidden aria-live="polite"></section>
    <section id="workspace-check-issues" aria-live="polite"></section>
  </main>
  {{ bootstrap|json_script:"workspace-bootstrap" }}
  <script type="module">
    import { applyWorkspaceSaveSuccess, createWorkspaceState, focusWorkspaceIssue, readWorkspaceBootstrap } from "{% static 'projects/workspace/state.js' %}";
    import { renderWorkspace } from "{% static 'projects/workspace/renderer.js' %}";
    import { bindCanvasInteractions } from "{% static 'projects/workspace/canvas-interaction.js' %}";
    import { createWorkspaceWorkflow } from "{% static 'projects/workspace/workflow.js' %}";
    import { presentWorkspaceError } from "{% static 'projects/workspace/errors.js' %}";
    const bootstrap = readWorkspaceBootstrap();
    const canvas = document.getElementById("workspace-canvas");
    const state = createWorkspaceState(bootstrap);
    renderWorkspace(canvas, state.draft, state);
    const canvasController = bindCanvasInteractions(canvas, state, renderWorkspace);
    const workflow = createWorkspaceWorkflow({ urls: bootstrap.urls });
    const errorPanel = document.getElementById("workspace-error");
    const issuePanel = document.getElementById("workspace-check-issues");
    const showError = (error) => { const view = presentWorkspaceError(error); errorPanel.hidden = false; errorPanel.textContent = `${view.what}：${view.why} ${view.nextAction}（${view.technicalCode}）`; };
    document.getElementById("workspace-save").addEventListener("click", async () => {
      try { const submittedDraft = canvasController.getState().draft; const response = await workflow.saveDraft(submittedDraft); const next = applyWorkspaceSaveSuccess(canvasController.getState(), response, submittedDraft); canvasController.replaceState(next); document.getElementById("workspace-draft-version").textContent = `当前草稿 v${next.draftVersion}`; document.getElementById("workspace-save-status").textContent = next.dirty ? "未保存修改：有" : "未保存修改：无"; errorPanel.hidden = true; }
      catch (error) { showError(error); }
    });
    document.getElementById("workspace-model-check").addEventListener("click", async () => {
      const current = canvasController.getState();
      if (current.dirty) { showError({ code: "UNSAVED_DRAFT", message: "本地修改尚未保存，服务器无法检查这些修改。" }); return; }
      try {
        const result = await workflow.checkModel(current.draftVersion); errorPanel.hidden = true; issuePanel.replaceChildren();
        if (result.ok) { issuePanel.textContent = "模型检查通过。"; return; }
        for (const issue of result.issues || []) { const button = document.createElement("button"); button.type = "button"; button.textContent = issue.human_message || "模型检查发现问题。"; button.addEventListener("click", () => canvasController.replaceState(focusWorkspaceIssue(canvasController.getState(), issue))); issuePanel.append(button); }
      } catch (error) { showError(error); }
    });
  </script>
  <script type="module" src="{% static 'projects/workspace/api.js' %}"></script>
</body>
</html>
